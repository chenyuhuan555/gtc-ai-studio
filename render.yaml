region: singapore

services:
  - type: web
    name: gtc-ai-studio-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GTCA_ALLOWED_USER_IDS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: SYNC_AUTH_DISABLED
        value: "false"
